<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <metadata><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/"><dc:creator><rdf:Seq><rdf:li>Karan Oroumchi</rdf:li></rdf:Seq></dc:creator><photoshop:AuthorsPosition>UI/UX engineer</photoshop:AuthorsPosition><photoshop:Credit>Karan Oroumchi, UI/UX engineer, karano.me</photoshop:Credit><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© Karan Oroumchi. All rights reserved.</rdf:li></rdf:Alt></dc:rights><xmpRights:Marked>True</xmpRights:Marked><xmpRights:WebStatement>https://karano.me</xmpRights:WebStatement><Iptc4xmpCore:CreatorContactInfo rdf:parseType="Resource"><Iptc4xmpCore:CiUrlWork>https://karano.me</Iptc4xmpCore:CiUrlWork></Iptc4xmpCore:CreatorContactInfo><dc:description><rdf:Alt><rdf:li xml:lang="x-default">The MANUS banner</rdf:li></rdf:Alt></dc:description></rdf:Description></rdf:RDF></x:xmpmeta></metadata>
  <!-- Machined Aluminum Outer Chassis -->
  <rect width="1200" height="340" rx="20" fill="#E2E0DA"/>
  <rect x="6" y="6" width="1188" height="328" rx="16" stroke="#B5B1A8" stroke-width="2"/>

  <!-- Recessed Glass OLED Screen -->
  <rect x="18" y="18" width="1164" height="304" rx="12" fill="#060609" stroke="#1E1E24" stroke-width="3"/>

  <!-- Subtle OLED Grid -->
  <g stroke="#F4EFE6" stroke-opacity="0.06" stroke-width="1">
    <line x1="18" y1="80" x2="1182" y2="80"/>
    <line x1="18" y1="170" x2="1182" y2="170"/>
    <line x1="18" y1="260" x2="1182" y2="260"/>
    <line x1="180" y1="18" x2="180" y2="322"/>
    <line x1="360" y1="18" x2="360" y2="322"/>
    <line x1="920" y1="18" x2="920" y2="322"/>
    <line x1="1060" y1="18" x2="1060" y2="322"/>
  </g>

  <!-- The MANUS icon (assets/brand/manus-icon.svg), 228px square -->
  <svg x="66" y="56" width="228" height="228" viewBox="0 0 1280 1280" fill="none">
    <rect width="1280" height="1280" rx="280" fill="#0B0B0F"/>
    <rect x="50" y="50" width="1180" height="1180" rx="230" stroke="#2A2A34" stroke-width="20"/>
    <rect x="110" y="110" width="1060" height="1060" rx="180" fill="#050508" stroke="#1E1E26" stroke-width="15"/>
    <g stroke-width="30" stroke-linecap="round" stroke-opacity="0.85">
      <path d="M340 200V1080" stroke="#2D7FF9"/>
      <path d="M540 200V1080" stroke="#F5A623"/>
      <path d="M740 200V1080" stroke="#E2E0DA"/>
      <path d="M940 200V1080" stroke="#FF3B2F"/>
    </g>
    <path d="M180 640C340 420 500 860 640 640C780 420 940 860 1100 640" stroke="#FFFFFF" stroke-width="35" stroke-linecap="round"/>
    <g stroke="#050508" stroke-width="20">
      <circle cx="340" cy="590" r="50" fill="#2D7FF9"/>
      <circle cx="540" cy="700" r="50" fill="#F5A623"/>
      <circle cx="740" cy="590" r="50" fill="#E2E0DA"/>
      <circle cx="940" cy="700" r="50" fill="#FF3B2F"/>
    </g>
  </svg>

  <!-- Words: Mona Sans and Monaspace Xenon, the app's own fonts (public/fonts); scripts/render-banner.mjs makes the PNG -->
  <g transform="translate(332, 0)">
    <rect x="0" y="58" width="166" height="26" rx="4" fill="#FF3B2F"/>
    <text x="12" y="76" fill="#FFFFFF" font-family="'Monaspace Xenon', monospace" font-size="13" font-weight="800" letter-spacing="1.5">PINCH THE LIGHT</text>
    <text x="180" y="76" fill="#2D7FF9" font-family="'Monaspace Xenon', monospace" font-size="13" font-weight="700" letter-spacing="1.2">IN THE BROWSER · THE CAMERA STAYS ON YOUR DEVICE</text>

    <text x="-4" y="182" fill="#FFFFFF" font-family="'Mona Sans', sans-serif" font-size="112" font-weight="900" letter-spacing="-3">MANUS</text>

    <text x="2" y="218" fill="#B5B1A8" font-family="'Monaspace Xenon', monospace" font-size="15.5" font-weight="500">Pinch a beam of light to play a note. Raise your hand to shape the sound.</text>

    <g transform="translate(0, 244)">
      <rect x="0" y="0" width="206" height="32" rx="5" fill="#121218" stroke="#2D7FF9" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#2D7FF9"/>
      <text x="28" y="20" fill="#F4EFE6" font-family="'Monaspace Xenon', monospace" font-size="11.5" font-weight="700">HAND TRACKING ON DEVICE</text>

      <rect x="218" y="0" width="163" height="32" rx="5" fill="#121218" stroke="#F5A623" stroke-width="1.5"/>
      <circle cx="234" cy="16" r="5" fill="#F5A623"/>
      <text x="246" y="20" fill="#F4EFE6" font-family="'Monaspace Xenon', monospace" font-size="11.5" font-weight="700">12 SAMPLED VOICES</text>

      <rect x="393" y="0" width="156" height="32" rx="5" fill="#121218" stroke="#E2E0DA" stroke-width="1.5"/>
      <circle cx="409" cy="16" r="5" fill="#E2E0DA"/>
      <text x="421" y="20" fill="#F4EFE6" font-family="'Monaspace Xenon', monospace" font-size="11.5" font-weight="700">PLAY-ALONG SONGS</text>

      <rect x="561" y="0" width="135" height="32" rx="5" fill="#121218" stroke="#FF3B2F" stroke-width="1.5"/>
      <circle cx="577" cy="16" r="5" fill="#FF3B2F"/>
      <text x="589" y="20" fill="#F4EFE6" font-family="'Monaspace Xenon', monospace" font-size="11.5" font-weight="700">WORKS OFFLINE</text>
    </g>
  </g>
</svg>
